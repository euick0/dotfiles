unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g focus-events on
set -g mouse on
set -g status-position top

# start window/pane numbering at 1 and renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with prefix + arrows; -r makes them repeatable, so after one
# prefix you can hold/tap arrows to keep resizing until repeat-time expires
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3
set -g repeat-time 700

# new splits and windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# floating scratch terminal: prefix + t toggles it; it's a persistent session
# named "popup", so whatever runs in it survives being hidden. On open it cd's
# to the current pane's directory, but only if the popup is idle at a shell
bind t if -F '#{==:#{session_name},popup}' {
  detach-client
} {
  run-shell 'p=#{q:pane_current_path}; tmux has -t popup 2>/dev/null || exit 0; case "$(tmux display -p -t popup "##{pane_current_command}")" in zsh|bash|fish|sh) ;; *) exit 0;; esac; [ "$(tmux display -p -t popup "##{pane_current_path}")" = "$p" ] || tmux send-keys -t popup -l " cd $(printf %q "$p")" \; send-keys -t popup Enter'
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s popup \\; set status off"
}

# vi keys in copy mode: v to select, C-v for rectangle, y to yank (tmux-yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# vim-tmux-navigator takes Ctrl-l, so clear the screen with prefix + Ctrl-l
bind C-l send-keys C-l

# plugins (prefix + I to install, prefix + U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Ctrl-h/j/k/l (no prefix) moves between tmux panes and nvim splits seamlessly
set -g @plugin 'christoomey/vim-tmux-navigator'
# copy selections to the system clipboard (y in copy mode, mouse drag)
set -g @plugin 'tmux-plugins/tmux-yank'

# resurrect: prefix + Ctrl-s to save, prefix + Ctrl-r to restore
set -g @resurrect-capture-pane-contents 'on'

# continuum: auto-save every 15 min and auto-restore when tmux starts
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# sessionx: fzf session/window picker with preview, replaces choose-tree on prefix + w
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'w'
set -g @sessionx-filter-current 'false'
set -g @sessionx-zoxide-mode 'on'
# ctrl+backspace kills the highlighted session (most terminals send it as ctrl-h, so bind both)
set -g @sessionx-bind-kill-session 'ctrl-bspace,ctrl-h'
# zoxide mode names the new window after the full path, which floods the status
# bar; shorten it to the directory's basename
set-hook -g after-new-session {
  if -F '#{m:/*,#{window_name}}' { rename-window -- '#{b:window_name}' }
}

# catppuccin theme
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
# show the window name (#W) instead of the pane title (#T), which defaults to the hostname
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g status-left ""
set -g @catppuccin_date_time_text " %H:%M"
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
